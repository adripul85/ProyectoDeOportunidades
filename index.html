<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De Oportunidades - Marketplace Seguro & Tratos Blindados</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // VIBRANT BLUE (Premium Marketplace)
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#2563eb', // Standard Blue
                            600: '#1d4ed8', // Darker Blue
                            700: '#1e40af',
                            900: '#1e3a8a',
                            vibrant: '#2222FF', // The specific "crazy" blue
                        },

                        // LUXURY DARK
                        dark: {
                            900: '#030712',
                            800: '#111827',
                            700: '#374151',
                            charcoal: '#0f172a',
                        },

                        // CLEAN LIGHT
                        light: {
                            50: '#f9fafb',
                            100: '#f3f4f6',
                            200: '#e5e7eb',
                        },

                        // Legacy mappings to keep layout working during transition
                        "border-light": "#f3f4f6", // More subtle borders
                        "dark-charcoal": "#111827",
                        "menta-dark": "#2563eb",
                        "menta": "#eff6ff",
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        display: ['Manrope', 'sans-serif'], // Switched to Manrope for headings
                        body: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        "premium": "0 4px 20px -1px rgba(0, 0, 0, 0.05), 0 2px 10px -1px rgba(0, 0, 0, 0.03)",
                        "trust": "0 4px 6px -1px rgba(0, 0, 0, 0.05)",
                        "trust-lg": "0 10px 25px -5px rgba(0, 0, 0, 0.05)",
                    },
                    borderRadius: {
                        '3xl': '1.5rem',
                        '4xl': '2rem',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --primary-vibrant: #2222FF;
            --primary-50: #eff6ff;
            --primary-100: #dbeafe;
            --dark-800: #111827;
            --light-50: #f9fafb;
            --light-100: #f3f4f6;
            --light-200: #e5e7eb;
            --shadow-premium: 0 4px 20px -1px rgba(0, 0, 0, 0.05), 0 2px 10px -1px rgba(0, 0, 0, 0.03);
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--light-50);
            color: var(--dark-800);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .trust-card {
            background-color: white;
            border: 1px solid var(--light-200);
            border-radius: 2rem;
            box-shadow: var(--shadow-premium);
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: var(--primary-vibrant);
            color: white;
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
            box-shadow: 0 10px 15px -3px rgba(34, 34, 255, 0.2);
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: white;
            color: var(--dark-800);
            border: 2px solid var(--light-200);
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-secondary:hover {
            background-color: var(--light-50);
        }

        .btn-secondary:active {
            transform: scale(0.98);
        }

        .search-input {
            background-color: var(--light-100);
            border: 2px solid transparent;
            border-radius: 1rem;
            padding: 1rem 1.5rem;
            font-weight: 700;
            color: var(--dark-800);
            transition: all 0.2s ease;
            outline: none;
        }

        .search-input:focus {
            background-color: white;
            border-color: var(--primary-100);
            box-shadow: 0 0 0 4px var(--primary-50);
        }

        .search-input::placeholder {
            color: #9ca3af;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
